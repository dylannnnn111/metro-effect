name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (methods on made-up data, and results.json matches a fresh run)
        run: python -m unittest discover tests -v
      - name: Re-run the analysis and fail if results.json changed
        run: |
          python -m metro.analysis
          git diff --exit-code results.json
